services:
  backend:
    build:
      context: .
      dockerfile: backend/Dockerfile
    environment:
      DATA_DIR: /app/data
      # Required: compose refuses to start without it (put it in .env, see .env.example).
      AUTH_TOKEN_SECRET: ${AUTH_TOKEN_SECRET:?Set AUTH_TOKEN_SECRET in .env (see .env.example)}
      AUTH_TOKEN_TTL: ${AUTH_TOKEN_TTL:-28800}
      # Optional: creates the first admin when data/users.json does not exist yet.
      ADMIN_EMAIL: ${ADMIN_EMAIL:-}
      ADMIN_PASSWORD: ${ADMIN_PASSWORD:-}
      OLLAMA_URL: ${OLLAMA_URL:-http://host.docker.internal:11434/api/chat}
      OLLAMA_MODEL: ${OLLAMA_MODEL:-gpt-oss:120b-cloud}
      OLLAMA_API_KEY: ${OLLAMA_API_KEY:-}
    extra_hosts:
      # Makes host.docker.internal work on Linux hosts too.
      - "host.docker.internal:host-gateway"
    volumes:
      - ./data:/app/data
    expose:
      - "8000"
    restart: unless-stopped

  frontend:
    build:
      context: .
      dockerfile: frontend/Dockerfile
    ports:
      - "${HTTP_PORT:-80}:80"
    depends_on:
      backend:
        condition: service_healthy
    restart: unless-stopped
