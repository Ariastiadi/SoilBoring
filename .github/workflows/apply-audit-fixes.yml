name: apply-audit-fixes
on: workflow_dispatch
permissions:
  contents: write
jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: |
          unzip -o audit-fixes.zip
          xargs -r -a DELETE-FILES.txt git rm -q -f --ignore-unmatch --
          rm -f audit-fixes.zip DELETE-FILES.txt
          git config user.name "Ariastiadi Saleh Herutjakra"
          git config user.email "235292680+Ariastiadi@users.noreply.github.com"
          git add -A
          git commit -m "Harden backend, fix frontend, improve Docker and docs [skip ci]"
          git push
