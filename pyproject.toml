# Used by Vercel (zero-config FastAPI). Docker and local development keep using
# backend/requirements.txt; the dependency list below must stay identical to it
# (checked by backend/tests/test_deploy.py).
[project]
name = "soilboring"
version = "1.0.0"
description = "Soil Boring Daily Log with AI"
requires-python = ">=3.10"
dependencies = [
    "fastapi>=0.115.0,<1.0",
    "uvicorn[standard]>=0.30.0,<1.0",
    "pydantic>=2.7.0,<3.0",
    "requests>=2.31.0,<3.0",
    "tzdata>=2024.1",
    "psycopg[binary,pool]>=3.2,<4.0",
]

[tool.vercel]
entrypoint = "backend.app.main:app"
